<script>
// =============================================
// SHARE GATE LOGIC (WITH 24-HOUR TIMER)
// =============================================
const shareGate = document.getElementById('shareGate');
const mainContainer = document.getElementById('container');
const shareCountDisplay = document.getElementById('shareCountDisplay');
const unlockedMessage = document.getElementById('unlockedMessage');
const shareHint = document.getElementById('shareHint');
const timeLeftMessage = document.getElementById('timeLeftMessage');
const floatPanel = document.getElementById('floatPanel'); // Get the float panel element

let shareCount = 0;
const requiredShares = 3;
const storageKey = 'currentUnlockStatus'; // 0 or 1 (locked/unlocked)
const timestampKey = 'shareGateUnlockTime'; // Unix timestamp

// --- Share Content Variables ---
const shareText = "🔥 FREE VIP HACK APK! 🔥\n\nFor more such types of free premium APKs and hacks, join our channel:\n\n🔗 https://telegram.me/apkmodderkings\n\nClick here to download the latest mod: " + window.location.href;


// --- Share Functions (Simulated) ---

function shareLink(platform) {
    // This is the simulated sharing action
    const currentUrl = encodeURIComponent(window.location.href);
    const text = encodeURIComponent(shareText);
    
    let url = '';
    
    switch(platform) {
        case 'telegram':
            url = `https://t.me/share/url?url=${currentUrl}&text=${text}`;
            break;
        case 'whatsapp':
            url = `whatsapp://send?text=${text} ${currentUrl}`;
            break;
        case 'facebook':
            // Facebook sharing uses URL and usually ignores custom text, so we use a simple share URL
            url = `https://www.facebook.com/sharer/sharer.php?u=${currentUrl}`;
            break;
        case 'message':
            // Fallback for generic sharing (opens native share sheet on mobile, or clipboard copy)
            if (navigator.share) {
                navigator.share({
                    title: 'VIP Hack APK',
                    text: shareText,
                    url: window.location.href,
                }).catch(error => console.log('Error sharing', error));
                return; // Prevent window.open if using navigator.share
            } else {
                // Generic share fallback (using window.open as a last resort)
                showToast("Please manually copy and paste the link to share!");
                // Simulating successful share after user sees the instruction
                break;
            }
        default:
            return;
    }
    
    // Open the share URL if it was generated and navigator.share wasn't used
    if (url) {
        window.open(url, '_blank');
    }
}


// Load state from local storage on startup
function loadShareState() {
    if (typeof(Storage) !== "undefined") {
        const unlockTime = localStorage.getItem(timestampKey);
        const isUnlocked = localStorage.getItem(storageKey);
        const now = Date.now();
        const twentyFourHoursInMs = 24 * 60 * 60 * 1000;
        
        // 1. Check if it was previously unlocked
        if (isUnlocked === '1' && unlockTime) {
            const expiryTime = parseInt(unlockTime, 10) + twentyFourHoursInMs;
            
            // 2. Check if 24 hours have passed
            if (now < expiryTime) {
                // Not expired yet: Grant access and update remaining time message
                shareCount = requiredShares; // Set count to show it's unlocked
                updateShareUI(expiryTime);
                return;
            } else {
                // Expired: Reset status and force user to share again
                localStorage.removeItem(storageKey);
                localStorage.removeItem(timestampKey);
                shareCount = 0;
            }
        }
        
        // Load partial share count if available (e.g., user shared once but closed)
        const partialShareCount = localStorage.getItem('partialShareCount');
        if (partialShareCount && isUnlocked !== '1') {
             shareCount = parseInt(partialShareCount, 10);
        } else if (isUnlocked !== '1') {
             shareCount = 0;
        }
    }
    updateShareUI();
}

// Helper to format remaining time
function formatTimeRemaining(expiryTime) {
    const remainingMs = expiryTime - Date.now();
    if (remainingMs <= 0) return "अब आप फिर से शेयर कर सकते हैं!";

    const totalSeconds = Math.floor(remainingMs / 1000);
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    return `एक्सेस प्राप्त है। अगले शेयर के लिए शेष: ${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
}

// Update UI (Show/Hide Gate)
function updateShareUI(expiryTime = null) {
    shareCountDisplay.textContent = shareCount;
    
    if (shareCount >= requiredShares) {
        // UNLOCK ACCESS
        shareGate.style.display = 'none';
        mainContainer.style.display = 'flex'; // Show the main content
        
        // Show floatPanel only after unlocking
        document.getElementById('floatPanel').style.display = 'flex'; 
        document.getElementById('toast').style.display = 'none'; 
        
        // Start showing the time left message (only for unlocked state)
        if (expiryTime) {
            timeLeftMessage.style.display = 'block';
            clearInterval(window.timerInterval);
            window.timerInterval = setInterval(() => {
                const now = Date.now();
                if (now >= expiryTime) {
                    clearInterval(window.timerInterval);
                    loadShareState(); // Reload state to reset the gate
                    return;
                }
                timeLeftMessage.textContent = formatTimeRemaining(expiryTime);
            }, 1000);
        }


    } else {
        // KEEP LOCKED
        shareGate.style.display = 'flex';
        mainContainer.style.display = 'none'; // Hide the main content
        
        // Hide floatPanel and toast while the gate is active
        document.getElementById('floatPanel').style.display = 'none'; 
        document.getElementById('toast').style.display = 'none'; 
        
        unlockedMessage.style.display = 'none';
        shareHint.style.display = 'block';
        timeLeftMessage.style.display = 'none';
    }
}

// Handle Share Button Click
function handleShare(platform) {
    if (shareCount < requiredShares) {
        // 1. Initiate the actual share action
        shareLink(platform);

        // 2. Increment count after share (simulated success)
        shareCount++;
        // Save partial count
        if (typeof(Storage) !== "undefined") {
            localStorage.setItem('partialShareCount', shareCount);
        }
        
        shareCountDisplay.textContent = shareCount;

        if (shareCount >= requiredShares) {
            // Final share: set unlock status and timestamp
            if (typeof(Storage) !== "undefined") {
                localStorage.setItem(storageKey, '1');
                localStorage.setItem(timestampKey, Date.now().toString());
                localStorage.removeItem('partialShareCount'); // Clear partial count
            }
            
            unlockedMessage.style.display = 'block';
            shareHint.style.display = 'none';
            
            const expiryTime = Date.now() + (24 * 60 * 60 * 1000);
            showToast("एक्सेस अनलॉक किया गया! आपको रीडायरेक्ट किया जा रहा है...");
            // Wait 1.5 seconds then transition to the main page
            setTimeout(() => {
                updateShareUI(expiryTime);
            }, 1500); 

        } else {
            showToast(`शेयर किया! अब ${requiredShares - shareCount} बार और!`);
        }
    }
}

// Initialize share gate state
loadShareState();

// =============================================
// DRAGGABLE FLOAT PANEL LOGIC
// =============================================
let isDragging = false;
let startX, startY, initialX, initialY;

// Setup Dragging (for desktop and mobile)
function setupDragListeners(element) {
    // Mouse Events for Desktop
    element.addEventListener('mousedown', dragStart);
    document.addEventListener('mouseup', dragEnd);
    document.addEventListener('mousemove', drag);
    
    // Touch Events for Mobile
    element.addEventListener('touchstart', dragStart, { passive: true });
    document.addEventListener('touchend', dragEnd);
    document.addEventListener('touchmove', drag, { passive: false }); // Needs to be non-passive for preventDefault
}

function dragStart(e) {
    if (e.target.tagName === 'A' || e.target.tagName === 'INPUT') return; // Ignore if clicking on interactive elements
    
    isDragging = true;
    floatPanel.style.cursor = 'grabbing';
    floatPanel.style.transition = 'none'; // Disable transition during drag

    // Get touch or mouse coordinates
    const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
    const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;

    // Get initial position relative to the viewport
    const rect = floatPanel.getBoundingClientRect();
    initialX = rect.left;
    initialY = rect.top;
    
    // Calculate offset
    startX = clientX - initialX;
    startY = clientY - initialY;
    
    if (e.type.includes('touch')) {
        // Prevent accidental scrolling while dragging on mobile
        e.preventDefault(); 
    }
}

function drag(e) {
    if (!isDragging) return;
    
    // Get touch or mouse coordinates
    const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
    const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;

    let newX = clientX - startX;
    let newY = clientY - startY;

    // Boundary Check (optional, but good practice)
    const bounds = {
        minX: 0,
        minY: 0,
        maxX: window.innerWidth - floatPanel.offsetWidth,
        maxY: window.innerHeight - floatPanel.offsetHeight
    };

    newX = Math.max(bounds.minX, Math.min(newX, bounds.maxX));
    newY = Math.max(bounds.minY, Math.min(newY, bounds.maxY));

    // Apply new position using absolute positioning
    floatPanel.style.left = newX + 'px';
    floatPanel.style.top = newY + 'px';
    floatPanel.style.transform = 'none'; // Remove the initial centering transform
}

function dragEnd(e) {
    if (!isDragging) return;
    isDragging = false;
    floatPanel.style.cursor = 'grab';
    floatPanel.style.transition = 'all 0.3s ease'; // Re-enable transition for smooth snaps/effects later
}

// Attach listeners to the float panel
setupDragListeners(floatPanel);

// =============================================
// ORIGINAL CODE LOGIC (UNCHANGED)
// =============================================
const hackPred=document.getElementById('prediction');
const timerEl=document.getElementById('timer');
const toast=document.getElementById('toast');
const toastMsg=document.getElementById('toastMsg');
let toastTimer;
function showToast(msg){clearTimeout(toastTimer);toast.style.display='block';toastMsg.textContent=msg;toastTimer=setTimeout(()=>{toast.style.display='none';},4000);}
function randPred(){return Math.random()<0.8?'SMALL':'BIG';}
let current=randPred();
function updateTick(){const now=new Date();const s=now.getUTCSeconds();const rem=60-s;timerEl.textContent=`${String(Math.floor(rem/60)).padStart(2,'0')}:${String(rem%60).padStart(2,'0')}`;if(s>=55){hackPred.textContent='WAIT';hackPred.style.opacity='0.6';}else if(s===0){current=randPred();hackPred.textContent=current;hackPred.style.opacity='1';showToast('New Prediction: '+current);}else{hackPred.textContent=current;hackPred.style.opacity='1';}}
updateTick();setInterval(updateTick,1000);
</script>
</body>
